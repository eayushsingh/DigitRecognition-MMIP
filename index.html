<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digit Recognition - MFCC + K-Means</title>
  <meta name="description" content="Speak a number and see it displayed instantly. Powered by MFCC feature extraction and K-Means clustering.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-group">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
        </div>
        <h1 class="app-title">Digit Recognition</h1>
      </div>
      <div class="header-controls">
        <div class="engine-selector-pill" id="engineSelector">
          <button type="button" class="engine-btn active" data-engine="speech" id="engineSpeechBtn">Speech</button>
          <button type="button" class="engine-btn" data-engine="kmeans" id="engineKMeansBtn">MFCC K-Means</button>
        </div>
        <div class="header-mode-toggle" id="headerModeToggle">
          <button type="button" class="mode-btn active" data-mode="S" id="modeBtnS">Single</button>
          <button type="button" class="mode-btn" data-mode="M" id="modeBtnM">Multi</button>
        </div>
      </div>
    </header>

    <!-- Hero Digit Display -->
    <main class="digit-display-panel">
      <div class="single-mode-view" id="singleModeView">
        <div class="display-card-single">
          <div class="card-glow-bg"></div>
          <div class="digit-huge" id="singleDigitValue">–</div>
          <div class="phonetic-label" id="singlePhoneticLabel">Say a number</div>
        </div>
      </div>

      <div class="multi-mode-view hidden" id="multiModeView">
        <div class="digit-cards-container" id="digitCardsContainer">
          <div class="placeholder-msg">Say a number</div>
        </div>
      </div>
    </main>

    <!-- Mic Button -->
    <section class="mic-section">
      <button type="button" class="mic-btn" id="micBtn" aria-label="Toggle Microphone">
        <div class="mic-pulse-ring"></div>
        <svg class="mic-svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
      </button>
      <div class="mic-label" id="micLabel">Tap to listen</div>
    </section>

    <!-- Audio Visualizer -->
    <section class="visualizer-section">
      <div class="canvas-wrapper">
        <canvas id="audioCanvas"></canvas>
      </div>
    </section>

    <!-- ML Visualizers -->
    <section class="ml-dashboard-section" id="mlDashboard">
      <div class="ml-card">
        <div class="ml-card-header">
          <span class="ml-title">MFCC Spectrogram</span>
        </div>
        <div class="canvas-container-sm">
          <canvas id="mfccCanvas"></canvas>
        </div>
      </div>
      <div class="ml-card">
        <div class="ml-card-header">
          <span class="ml-title">K-Means Distances</span>
          <span class="ml-badge" id="kmeansWinnerTag">–</span>
        </div>
        <div class="canvas-container-sm">
          <canvas id="kmeansCanvas"></canvas>
        </div>
      </div>
    </section>

    <!-- Quick Test Chips -->
    <section class="presets-section">
      <h3 class="section-title">Test Samples</h3>
      <div class="preset-chips">
        <button type="button" class="chip" data-speak="Seven" data-digit="7">7</button>
        <button type="button" class="chip" data-speak="Three" data-digit="3">3</button>
        <button type="button" class="chip" data-speak="Zero" data-digit="0">0</button>
        <button type="button" class="chip" data-speak="Nine Five Two" data-digit="9">9 5 2</button>
        <button type="button" class="chip" data-speak="Forty Two" data-digit="4">42</button>
        <button type="button" class="chip" data-speak="One Two Three" data-digit="1">1 2 3</button>
      </div>
    </section>

    <!-- History -->
    <section class="history-section">
      <div class="history-header">
        <h3 class="section-title">History</h3>
        <div class="history-actions">
          <button type="button" class="btn btn-sm btn-outline" id="clearHistoryBtn">Clear</button>
        </div>
      </div>
      <div class="history-list" id="historyList">
        <div class="history-empty">No digits recognized yet</div>
      </div>
    </section>

    <footer class="app-footer">
      <p>Digit Recognition &bull; MFCC + K-Means</p>
    </footer>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script type="module" src="/main.js"></script>
</body>
</html>
